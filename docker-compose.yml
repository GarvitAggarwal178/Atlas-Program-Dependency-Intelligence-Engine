version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: symex
      POSTGRES_PASSWORD: symex
      POSTGRES_DB: symex
    ports:
      - "5432:5432"
    volumes:
      - symex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U symex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  symex_pgdata:
